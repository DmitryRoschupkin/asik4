<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Qosshy alga 03</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-3 rounded-3">
        <div class="title text-white p-3">
            <h1>Book a train ticket!</h1>
        </div>
        <div class="form-wrapper p-4">
            <form>
                <div class="row mb-3 gap-3">
                    <input type="text" class="col form-control">
                    <input type="text" class="col form-control">
                </div>
                <div class="row mb-3 gap-3">
                    <div class="col">
                        <label for="departure">Departure</label>
                        <input type="date" class="form-control" id="departure">
                    </div>

                    <div class="col">
                        <label for="return">Return</label>
                        <input type="date" class="form-control" id="return">
                    </div>

                    <div class="col">
                        <label for="Passengers">Passengers</label>
                        <select class="form-control" id="passengers">
                            <option>1 adult</option>
                            <option>2 adults</option>
                            <option>3 adults</option>
                            <option>4 adults</option>
                            <option>5 adults</option>
                            <option>6 adults</option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3 ">
                    <h6>Carriage class</h6>
                    <div class="col">
                        <input type="radio" id="seat">
                        <label for="seat">Seat</label>
                    </div>
                    <div class="col">
                        <input type="radio" id="coupe">
                        <label for="coupe">Coupe</label>
                    </div>
                    <div class="col">
                        <input type="radio" id="sleeper">
                        <label for="sleeper">Sleeper</label>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <label for="phone">Phone</label>
                        <input type="text" class="form-control" id="phone">
                    </div>

                    <div class="col">
                        <label for="email">Email</label>
                        <input type="text" class="col form-control" id="email">
                    </div>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="switchStandard">
                    <label class="form-check-label" for="switchStandard">Also send the ticket by SMS</label>
                </div>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
