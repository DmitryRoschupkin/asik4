<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>task3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow p-4">
            <h2 class="mb-4">Reserve a table</h2>
            <form>
                <div class="mb-3">
                    <label for="name" class="form-label">Your name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="phone" required>
                </div>
                <div class="mb-3">
                    <label for="guests" class="form-label">Guests</label>
                    <input type="number" class="form-control" id="guests" min="1" max="20" value="2" required>
                </div>
                <div class="mb-3">
                    <label for="reservation-date" class="form-label">Date</label>
                    <input type="date" class="form-control" id="reservation-date" required>
                </div>
                <div class="mb-3">
                    <label class="form-label d-block">Seating</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="seating" id="seating-inside" checked required>
                        <label class="form-check-label" for="seating-inside">Inside</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="seating" id="seating-terrace" required>
                        <label class="form-check-label" for="seating-terrace">Terrace</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="meal-time" class="form-label">Meal time</label>
                    <select class="form-select" id="meal-time">
                        <option>Lunch</option>
                        <option>Dinner</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="comments" class="form-label">Comments</label>
                    <textarea class="form-control" id="comments" rows="3" placeholder="Additional wishes..."></textarea>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="terms" required>
                    <label class="form-check-label" for="terms">I agree to the terms</label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Reserve</button>
            </form>
        </div>
    </div>
</body>
</html>
